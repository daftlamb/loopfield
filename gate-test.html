<!doctype html><meta charset="utf-8"><title>Gate audio test</title><button id="run">Test gate</button><pre id="result">READY</pre><script type="module">
import {makeProject} from './model.js';import {playStep} from './audio.js';
run.onclick=async()=>{try{const render=async gate=>{const ctx=new OfflineAudioContext(1,44100,44100),p=makeProject(),t={...p.patterns[0][0],kind:'sine',fm:0,pan:0,cutoff:18000},s={...t.steps[0],gate,ratchet:1};playStep(ctx,{input:ctx.destination},t,s,0,.25);return (await ctx.startRendering()).getChannelData(0);};const [short,long]=await Promise.all([render(100),render(200)]);const rms=(a,start,end)=>Math.sqrt(a.slice(start*44100,end*44100).reduce((s,v)=>s+v*v,0)/((end-start)*44100));if(rms(short,.4,.45)>.0001||rms(long,.4,.45)<.001||rms(long,.7,.8)>.0001)throw Error('Gate duration incorrect');result.textContent='PASS: 200% sustains beyond 100%; release reaches silence. '+rms(long,.4,.45).toFixed(4);}catch(e){result.textContent='FAIL '+e.stack;}};
</script>
