<!doctype html><meta charset="utf-8"><title>Song audio verification</title><button id="run">Run audio checks</button><pre id="result">READY</pre><script type="module">
import {makeProject} from './model.js';import {renderWav} from './audio.js';
run.onclick=async()=>{run.disabled=true;try{const p=makeProject();p.bpm=220;p.song=[{pattern:0,repeats:2},{pattern:1,repeats:1}];p.patterns[1].forEach(t=>t.mute=true);const pattern=await (await renderWav(p)).arrayBuffer(),song=await (await renderWav(p,'song')).arrayBuffer();const seconds=b=>(b.byteLength-44)/176400;const delta=seconds(song)-seconds(pattern);if(Math.abs(delta-16*60/220)>.0001)throw Error('Song duration mismatch '+delta);const data=new DataView(song);let peak=0;for(let i=44;i<song.byteLength;i+=2)peak=Math.max(peak,Math.abs(data.getInt16(i,true)));if(!peak)throw Error('Silent song');let tail=0;for(let i=song.byteLength-176400;i<song.byteLength;i+=2)tail=Math.max(tail,Math.abs(data.getInt16(i,true)));if(tail>2)throw Error('Muted final pattern or tail not silent');result.textContent='PASS: Pattern / Song WAV duration, audible signal, muted final pattern, tail silence.\n'+seconds(pattern).toFixed(3)+'s / '+seconds(song).toFixed(3)+'s; peak '+peak;}catch(e){result.textContent='FAIL: '+e.stack;}finally{run.disabled=false;}};
</script>
