<circle cx="506" cy="588" r="23" fill="#25302d" stroke="none"/>
<text x="498" y="596" font-family="Microsoft YaHei,Noto Sans SC,sans-serif" font-size="23" fill="#f6f5ef">A</text>
<circle cx="470" cy="624" r="23" fill="#25302d" stroke="none"/>
<text x="462" y="632" font-family="Microsoft YaHei,Noto Sans SC,sans-serif" font-size="23" fill="#f6f5ef">B</text>
<text x="579" y="568" font-family="Microsoft YaHei,Noto Sans SC,sans-serif" font-size="20" fill="#25302d">X / 编辑项</text>
<text x="579" y="598" font-family="Microsoft YaHei,Noto Sans SC,sans-serif" font-size="20" fill="#25302d">A / 开关格</text>
<text x="579" y="628" font-family="Microsoft YaHei,Noto Sans SC,sans-serif" font-size="20" fill="#25302d">B / 试听</text>
<text x="579" y="658" font-family="Microsoft YaHei,Noto Sans SC,sans-serif" font-size="20" fill="#25302d">Y / 换页</text>
<path d="M530,588 L568,588" fill="none" stroke="#2f765c" stroke-width="1.3"/>
