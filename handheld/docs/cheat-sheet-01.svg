<rect x="56" y="830" width="5" height="118" rx="2" fill="#2f765c" stroke="none"/>
<text x="80" y="868" font-family="Microsoft YaHei,Noto Sans SC,sans-serif" font-size="25" fill="#2f765c">30 秒开始</text>
<text x="80" y="905" font-family="Microsoft YaHei,Noto Sans SC,sans-serif" font-size="21" fill="#25302d">START 播放 → A 开格 → B + 方向键改音高。</text>
<text x="80" y="934" font-family="Microsoft YaHei,Noto Sans SC,sans-serif" font-size="21" fill="#25302d">Fn1/Fn2 沿用系统设置，本版没有专用操作。</text>
<rect x="720" y="192" width="664" height="206" rx="10" fill="#ffffff" stroke="#d5dcd4"/>
<rect x="720" y="192" width="5" height="206" rx="2" fill="#2f765c" stroke="none"/>
<text x="744" y="230" font-family="Microsoft YaHei,Noto Sans SC,sans-serif" font-size="25" fill="#2f765c">基本操作</text>
<text x="744" y="267" font-family="Microsoft YaHei,Noto Sans SC,sans-serif" font-size="21" fill="#25302d">方向键移动；B + 方向键修改当前编辑值。</text>
<text x="744" y="296" font-family="Microsoft YaHei,Noto Sans SC,sans-serif" font-size="21" fill="#25302d">X 切 NOTE / VEL / CHANCE / GATE 等编辑项。</text>
<text x="744" y="325" font-family="Microsoft YaHei,Noto Sans SC,sans-serif" font-size="21" fill="#25302d">Y 下一页；按住 Y + ← 返回上一页。</text>
<text x="744" y="354" font-family="Microsoft YaHei,Noto Sans SC,sans-serif" font-size="21" fill="#25302d">L / R 切换音轨；MENU 循环切颜色主题。</text>
<rect x="720" y="416" width="664" height="235" rx="10" fill="#ffffff" stroke="#d5dcd4"/>
<rect x="720" y="416" width="5" height="235" rx="2" fill="#2f765c" stroke="none"/>
<text x="744" y="454" font-family="Microsoft YaHei,Noto Sans SC,sans-serif" font-size="25" fill="#2f765c">SELECT 层 / 工程与运输</text>
<text x="744" y="491" font-family="Microsoft YaHei,Noto Sans SC,sans-serif" font-size="21" fill="#25302d">SELECT + L / R：切 Pattern，播放时等轮末。</text>
<text x="744" y="520" font-family="Microsoft YaHei,Noto Sans SC,sans-serif" font-size="21" fill="#25302d">SELECT + ↑ / ↓：总音量；+ ← / →：BPM。</text>
<text x="744" y="549" font-family="Microsoft YaHei,Noto Sans SC,sans-serif" font-size="21" fill="#25302d">SELECT + A / B：当前轨静音 / 独奏。</text>
<text x="744" y="578" font-family="Microsoft YaHei,Noto Sans SC,sans-serif" font-size="21" fill="#25302d">SELECT + X / Y：保存 / 读取工程。</text>
<text x="744" y="607" font-family="Microsoft YaHei,Noto Sans SC,sans-serif" font-size="21" fill="#25302d">SELECT + START：保存并退出应用。</text>
<rect x="720" y="669" width="664" height="173" rx="10" fill="#ffffff" stroke="#d5dcd4"/>
<rect x="720" y="669" width="5" height="173" rx="2" fill="#bd593b" stroke="none"/>
<text x="744" y="707" font-family="Microsoft YaHei,Noto Sans SC,sans-serif" font-size="25" fill="#bd593b">Punch-in / 总输出临时 FX</text>
<text x="744" y="744" font-family="Microsoft YaHei,Noto Sans SC,sans-serif" font-size="21" fill="#25302d">按住 L + R，再按 A 碎切 / B 失真 / X 回声 / Y 滤波。</text>
<text x="744" y="773" font-family="Microsoft YaHei,Noto Sans SC,sans-serif" font-size="21" fill="#25302d">继续按住效果键，用 ← / → 调力度，每次 5%。</text>
<text x="744" y="802" font-family="Microsoft YaHei,Noto Sans SC,sans-serif" font-size="21" fill="#25302d">可叠加；箭头指示调节对象；松键恢复原声。</text>
<rect x="720" y="860" width="664" height="88" rx="10" fill="#ffffff" stroke="#d5dcd4"/>
<rect x="720" y="860" width="5" height="88" rx="2" fill="#2f765c" stroke="none"/>
<text x="744" y="898" font-family="Microsoft YaHei,Noto Sans SC,sans-serif" font-size="25" fill="#2f765c">X 层 / 音高与调式</text>
<text x="744" y="935" font-family="Microsoft YaHei,Noto Sans SC,sans-serif" font-size="21" fill="#25302d">X + ←/→ 半音；+ ↑/↓ 八度；+ L/R 调式；+ A/B 根音。</text>
</svg>