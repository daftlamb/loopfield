<!doctype html><meta charset="utf-8"><title>Note preview / MIDI checks</title>
<button id="run">Run preview checks</button><pre id="result">READY</pre>
<script type="module">
import {Engine,createBus} from './audio.js';
import {makeEmptyProject} from './model.js';
import {MidiOut} from './midi.js';
const assert=(value,message)=>{if(!value)throw Error(message);};
document.querySelector('#run').onclick=async()=>{
  const output=document.querySelector('#result');output.textContent='RUNNING';
  try{
    const p=makeEmptyProject(),t=p.patterns[0][0];Object.assign(t,{kind:'sine',fm:0,attack:.005,decay:.2,volume:.7,cutoff:9000,resonance:.1,pan:0});
    const e=new Engine(()=>p,()=>{});e.ctx=new OfflineAudioContext(2,12000,24000);e.bus=createBus(e.ctx,p.master,p.fx,p.trackFx);e.init=async()=>{};
    const sent=[];e.midi=new MidiOut(()=>{},()=>0);e.midi.port={send:(data,time)=>sent.push({data,time}),clear(){}};
    await Promise.all([e.previewNote(t,{...t.steps[0],note:69,velocity:1}),e.previewNote(t,{...t.steps[0],note:81,velocity:1})]);
    e.midi.flush(e.ctx);assert(sent.filter(m=>m.data[0]===0x90).length===1,'rapid preview queued old notes');assert(sent[0].data[1]===81,'wrong preview MIDI note');
    const buffer=await e.ctx.startRendering(),data=buffer.getChannelData(0);let crossings=0,power=0;
    for(let i=1200;i<3600;i++){power+=data[i]*data[i];if(data[i-1]<=0&&data[i]>0)crossings++;}
    const frequency=crossings*10;assert(power>.001,'preview silent');assert(Math.abs(frequency-880)<25,'preview did not play the latest pitch');
    e.midi.flush(e.ctx);assert(sent.at(-1).data[0]===0x80,'preview note-off missing');
    output.textContent=JSON.stringify({status:'PASS',frequency,midi:sent,checks:['latest edited pitch','audible preview','MIDI pitch and note-off']},null,2);
  }catch(error){output.textContent='FAIL '+error.stack;}
};
</script>
